<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ঢাকা বাস Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--card2:#f0f1f6;
  --gr:#16a34a;--gr2:#22c55e;--grg:rgba(22,163,74,.08);
  --bl:#2563eb;--blg:rgba(37,99,235,.08);
  --ye:#d97706;--yg:rgba(217,119,6,.08);
  --re:#dc2626;--pu:#7c3aed;
  --tx:#111827;--td:#6b7280;--tm:#9ca3af;--tbdr:#e5e7eb;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── TOP BAR ── */
.topbar{background:var(--gr);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:22px}
.topbar-title{color:#fff;font-weight:800;font-size:18px;letter-spacing:-.5px}
.topbar-title span{opacity:.75;font-weight:500;font-size:13px;display:block;letter-spacing:0}
.topbar-badge{background:rgba(255,255,255,.2);color:#fff;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;letter-spacing:.5px}
.visitor-counter{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;padding:5px 11px;border-radius:20px;font-weight:600;backdrop-filter:blur(4px)}
.visitor-counter .vc-icon{font-size:13px}
.visitor-counter .vc-num{font-size:13px;font-weight:800;letter-spacing:-.3px}
.visitor-counter .vc-label{opacity:.8;font-size:10px;font-weight:500}

/* ── MAIN TABS ── */
.main-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--tbdr);position:sticky;top:0;z-index:100}
.main-tab{flex:1;padding:14px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--td);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.main-tab.on{color:var(--gr);border-bottom-color:var(--gr)}
.main-panel{display:none}
.main-panel.on{display:block}

/* ── PAGE WRAP ── */
.page{max-width:680px;margin:0 auto;padding:20px 16px 80px}

/* ── SEARCH CARD ── */
.search-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow-md);padding:20px;margin-bottom:16px}
.search-card-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;color:var(--tx)}
.search-card-sub{font-size:13px;color:var(--td);margin-bottom:18px}

/* ── INPUT BOX ── */
.input-box{border:2px solid var(--tbdr);border-radius:12px;overflow:visible;margin-bottom:14px;background:var(--card);position:relative;transition:border-color .2s}
.input-box:focus-within{border-color:var(--gr)}
.irow{display:flex;align-items:center}
.iico{padding:0 14px;font-size:15px;flex-shrink:0}
.si{flex:1;background:transparent;border:none;color:var(--tx);font-family:'Inter',sans-serif;font-size:16px;font-weight:500;padding:14px 48px 14px 0;outline:none;caret-color:var(--gr);-webkit-text-fill-color:var(--tx)}
.si::placeholder{color:var(--tm);-webkit-text-fill-color:var(--tm);font-weight:400}
.si:-webkit-autofill,.si:-webkit-autofill:focus{-webkit-text-fill-color:var(--tx)!important;-webkit-box-shadow:0 0 0 1000px #fff inset!important}
.idiv{height:1px;background:var(--tbdr);margin:0 14px}
.swapbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--grg);border:1.5px solid var(--gr);color:var(--gr);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:5}
.swapbtn:hover{background:var(--gr);color:#fff}

/* ── AUTOCOMPLETE ── */
.adrop,.bdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1.5px solid var(--tbdr);border-radius:12px;z-index:999;max-height:220px;overflow-y:auto;display:none;box-shadow:var(--shadow-lg)}
.adrop.on,.bdrop.on{display:block}
.aci{padding:12px 16px;cursor:pointer;font-size:14px;color:var(--td);border-bottom:1px solid var(--tbdr);transition:background .1s;font-weight:500}
.aci:last-child{border-bottom:none}
.aci:hover,.aci.sel{background:var(--grg);color:var(--gr)}
.aci mark{background:none;color:var(--gr);font-weight:700}

/* ── FIND BUTTON ── */
.find-btn{width:100%;background:var(--gr);color:#fff;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;padding:15px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.find-btn:hover{background:#15803d;transform:translateY(-1px);box-shadow:0 6px 20px rgba(22,163,74,.4)}
.find-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RUSH BANNER ── */
#rush{display:none;background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:10px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:14px;line-height:1.5}

/* ── POPULAR CHIPS ── */
.chips-label{font-size:11px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card2);border:1.5px solid var(--tbdr);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--td);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--gr);color:var(--gr);background:var(--grg)}
.chip-arr{color:var(--tm);font-size:10px}

/* ── RESULT HEADER ── */
.result-header{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.result-from-to{font-size:18px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.res-arr{color:var(--gr);margin:0 6px}
.result-counts{display:flex;gap:8px}
.rc-d{background:rgba(22,163,74,.1);color:var(--gr);border:1px solid rgba(22,163,74,.2);font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600}
.rc-t{background:rgba(37,99,235,.1);color:var(--bl);border:1px solid rgba(37,99,235,.2);font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600}

/* ── SUMMARY BAR ── */
.summary-bar{display:flex;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #bbf7d0;border-radius:14px;margin-bottom:14px;overflow:hidden}
.sb-item{flex:1;padding:14px 10px;text-align:center}
.sb-val{font-size:20px;font-weight:800;color:var(--gr);line-height:1}
.sb-lbl{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-top:3px;font-weight:600}
.sb-div{width:1px;background:#bbf7d0;margin:10px 0}

/* ── RESULT TABS ── */
.rtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtab{background:var(--card);border:1.5px solid var(--tbdr);border-radius:20px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--td);cursor:pointer;white-space:nowrap;transition:all .15s}
.rtab.on{background:var(--gr);border-color:var(--gr);color:#fff}
.rtpanel{display:none}
.rtpanel.on{display:block}
.alt-label{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:1.5px;padding:10px 4px 6px}

/* ── ROUTE CARD ── */
.rcard{background:var(--card);border:1.5px solid var(--tbdr);border-radius:14px;margin-bottom:10px;overflow:hidden;animation:fadein .25s ease forwards;opacity:0;box-shadow:var(--shadow)}
@keyframes fadein{to{opacity:1;transform:none}from{opacity:0;transform:translateY(6px)}}
.rcard:hover{border-color:#d1d5db;box-shadow:var(--shadow-md)}
.rcard-hd{padding:16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none}
.rico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--grg);border:1.5px solid rgba(22,163,74,.2)}
.rico-tr{background:var(--blg);border-color:rgba(37,99,235,.2)}
.rinfo{flex:1;min-width:0}
.rname{font-size:15px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname-bn{font-family:'Tiro Bangla',serif;font-size:12px;color:var(--td);margin-top:2px}
.rtags2{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.rtag{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600}
.rtag-easy{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.rtag-med{background:#fef9c3;color:#713f12;border:1px solid #fde047}
.rtag-tr{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.rtag-stops{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}
.rtag-time{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.rtag-fare{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:700}
.rtag-ot{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.chev{color:var(--tm);font-size:13px;flex-shrink:0;margin-top:4px;transition:transform .2s}
.rcard.open .chev{transform:rotate(180deg)}
.rbody{display:none;border-top:1px solid var(--tbdr)}
.rcard.open .rbody{display:block}

/* ── WHY SECTION ── */
.why-section{padding:14px 16px;background:#f0fdf4;border-bottom:1px solid var(--tbdr)}
.why-title{font-size:10px;font-weight:700;color:var(--gr);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:9px}
.why-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--td);line-height:1.5;margin-bottom:5px;font-weight:500}
.why-row:last-child{margin-bottom:0}
.why-row span:first-child{color:var(--gr);font-size:12px;flex-shrink:0;margin-top:1px;font-weight:700}
.why-row.bad span:first-child{color:var(--ye)}

/* ── LOCAL TIP ── */
.ltip{padding:12px 16px;border-left:3px solid var(--bl);background:#eff6ff;border-bottom:1px solid var(--tbdr);font-size:13px;color:#1e40af;line-height:1.6}

/* ── STEPS ── */
.steps{padding:16px}
.step{display:flex;gap:12px;margin-bottom:14px;position:relative}
.step:last-child{margin-bottom:0}
.step-line{position:absolute;left:11px;top:26px;bottom:-15px;width:2px;background:var(--tbdr)}
.step:last-child .step-line{display:none}
.snum{width:24px;height:24px;border-radius:50%;background:var(--gr);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.snum.b{background:var(--bl)}
.snum.y{background:var(--ye)}
.snum.d{background:#9ca3af}
.stxt{flex:1}
.sact{font-size:13px;font-weight:600;color:var(--tx);line-height:1.4;margin-bottom:3px}
.sdet{font-size:12px;color:var(--td);line-height:1.5}
.stip{font-size:11px;color:var(--ye);margin-top:4px;font-weight:600}

/* ── TRAIL ── */
.trail{padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.trail::-webkit-scrollbar{display:none}
.tinner{display:flex;align-items:flex-start;min-width:max-content}
.tstop{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tstop::after{content:'───';color:#e5e7eb;font-size:9px;position:absolute;top:6px;left:calc(100% - 3px);letter-spacing:-2px}
.tstop:last-child::after{display:none}
.tdot{width:12px;height:12px;border-radius:50%;border:2px solid #d1d5db;background:#fff;z-index:1}
.tstop.hl .tdot{border-color:var(--gr);background:var(--gr);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.tname{font-size:9px;color:var(--td);text-align:center;white-space:nowrap;max-width:68px;overflow:hidden;text-overflow:ellipsis;padding:0 3px;font-weight:500}
.tstop.hl .tname{color:var(--gr);font-weight:700}

/* ── VERIFY ── */
.verrow{padding:12px 16px;border-top:1px solid var(--tbdr);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafafa}
.verq{font-size:12px;color:var(--td);flex:1;min-width:90px;font-weight:500}
.vbtns{display:flex;gap:6px}
.vbtn{border:1.5px solid var(--tbdr);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;font-weight:600;font-family:'Inter',sans-serif;background:var(--card);transition:all .15s}
.vy{color:var(--gr)}
.vy:hover{background:var(--grg);border-color:var(--gr)}
.vn{color:var(--re)}
.vn:hover{background:#fef2f2;border-color:var(--re)}
.vbtn:disabled{opacity:.5;cursor:default}
.vok{font-size:11px;color:var(--gr);font-weight:600}
.vnone{font-size:11px;color:var(--tm)}

/* ── TRANSFER LEGS ── */
.transfer-legs{padding:14px 16px;border-top:1px solid var(--tbdr);display:flex;flex-direction:column;gap:8px}
.tleg{background:#f9fafb;border:1.5px solid var(--tbdr);border-radius:10px;padding:12px 14px}
.tleg-n{font-size:10px;color:var(--tm);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.tleg-bus{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:2px}
.tleg-s{font-size:11px;color:var(--td)}
.tpt{color:var(--ye);font-size:12px;font-weight:700;padding:2px 0;display:flex;align-items:center;gap:7px}

/* ── BUS SEARCH ── */
.bus-search-box{background:var(--card);border-radius:16px;box-shadow:var(--shadow-md);padding:20px;margin-bottom:16px}
.bus-search-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.bus-search-sub{font-size:13px;color:var(--td);margin-bottom:16px}
.bus-input-wrap{position:relative}
.bus-input{width:100%;border:2px solid var(--tbdr);border-radius:12px;padding:14px 16px;font-size:16px;font-family:'Inter',sans-serif;font-weight:500;color:var(--tx);outline:none;background:var(--card);transition:border-color .2s}
.bus-input:focus{border-color:var(--gr)}
.bus-input::placeholder{color:var(--tm)}
.bus-card{background:var(--card);border:1.5px solid var(--tbdr);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.bus-card-head{padding:16px;display:flex;align-items:flex-start;gap:12px;background:linear-gradient(135deg,#f0fdf4,#fff)}
.bus-icon{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--grg);border-radius:12px;flex-shrink:0}
.bus-card-info{flex:1}
.bus-card-name{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:3px}
.bus-card-bn{font-family:'Tiro Bangla',serif;font-size:13px;color:var(--td);margin-bottom:6px}
.bus-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.btag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.btag-svc{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.btag-time{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.bus-route-strip{padding:14px 16px;border-top:1px solid var(--tbdr)}
.bus-route-label{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bus-route-count{font-size:11px;font-weight:600;color:var(--td);background:#f3f4f6;padding:2px 8px;border-radius:10px;margin-left:auto}
.bus-stops-list{display:flex;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;gap:0}
.bus-stops-list::-webkit-scrollbar{display:none}
.bs-stop{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:72px}
.bs-stop::after{content:'──';color:#e5e7eb;font-size:9px;position:absolute;top:6px;left:calc(100% - 4px);letter-spacing:-2px}
.bs-stop:last-child::after{display:none}
.bs-dot{width:12px;height:12px;border-radius:50%;border:2px solid #d1d5db;background:#fff}
.bs-end .bs-dot{border-color:var(--gr);background:var(--gr);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.bs-name{font-size:9px;color:var(--td);text-align:center;white-space:nowrap;max-width:68px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bs-end .bs-name{color:var(--gr);font-weight:700}

/* ── NO RESULT / ERROR ── */
.no-result{text-align:center;padding:48px 20px;color:var(--td)}
.no-em{font-size:48px;margin-bottom:12px}
.errbox{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:12px 16px;color:var(--re);font-size:13px;margin-bottom:12px;font-weight:500}
.loading-msg{text-align:center;padding:40px;color:var(--td);font-size:13px;font-weight:500}

footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--tbdr);padding:10px;text-align:center;font-size:11px;color:var(--tm);font-weight:500;z-index:50}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
@media(max-width:480px){.si{font-size:15px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">🚌</div>
    <div class="topbar-title">ঢাকা বাস Finder<span>Real routes · Real fares</span></div>
  </div>
  <div class="visitor-counter">
    <span class="vc-icon">👁️</span>
    <span class="vc-num" id="vcNum">…</span>
    <span class="vc-label">visitors</span>
  </div>
</div>

<div class="main-tabs">
  <div class="main-tab on" data-tab="search">🔍 Find Route</div>
  <div class="main-tab" data-tab="bus">🚌 Bus Search</div>
</div>

<div class="main-panel on" id="panel-search">
  <div class="page">
    <div id="rush"></div>
    <div class="search-card">
      <div class="search-card-title">Where are you going?</div>
      <div class="search-card-sub">Enter your stops to find the best bus route</div>
      <div class="input-box">
        <div class="irow">
          <span class="iico">🟢</span>
          <input class="si" id="fromIn" placeholder="From — e.g. Mirpur 10" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
          <div class="adrop" id="fromDrop"></div>
        </div>
        <div class="idiv"></div>
        <div class="irow">
          <span class="iico">🔴</span>
          <input class="si" id="toIn" placeholder="To — e.g. Farmgate" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
          <div class="adrop" id="toDrop"></div>
        </div>
        <button class="swapbtn" id="swapBtn">⇅</button>
      </div>
      <button class="find-btn" id="findBtn">
        <span id="findLbl">Find My Route</span>
        <div class="spinner" id="findSp"></div>
      </button>
      <div class="chips-label">Popular routes</div>
      <div class="chips" id="chipsEl"></div>
    </div>
    <div id="routeResult"></div>
  </div>
</div>

<div class="main-panel" id="panel-bus">
  <div class="page">
    <div class="bus-search-box">
      <div class="bus-search-title">Search a Bus</div>
      <div class="bus-search-sub">Find a bus by name and see its full route</div>
      <div class="bus-input-wrap">
        <input class="bus-input" id="busSearchIn" placeholder="Type bus name — e.g. Hazi Transport" autocomplete="off" spellcheck="false">
        <div class="bdrop" id="busDrop"></div>
      </div>
    </div>
    <div id="busResult"></div>
  </div>
</div>

function norm(q){return q.toLowerCase().split(' ').join('').split('-').join('');}
function findStop(q){
  q=q.trim();if(!q)return null;
  for(const[n,id]of Object.entries(SBN))if(n.toLowerCase()===q.toLowerCase())return id;
  const nq=norm(q);
  let best=null,bs=-1;
  for(const[n,id]of Object.entries(SBN)){const nn=norm(n);if(nn.startsWith(nq)){const s=SF[String(id)]||0;if(s>bs){best=id;bs=s;}}}
  if(best!==null)return best;
  for(const[n,id]of Object.entries(SBN)){const nn=norm(n);if(nn.includes(nq)){const s=SF[String(id)]||0;if(s>bs){best=id;bs=s;}}}
  return best;
}
function findDirect(fId,tId){
  const ts=String(tId),tm={};
  for(const e of(SR[ts]||[]))tm[e.r]=e.o;
  const res=[];
  for(const fe of(SR[String(fId)]||[])){
    if(!(fe.r in tm))continue;const to=tm[fe.r];if(fe.o>=to)continue;
    const rt=RBI[fe.r],bus=BUSES[String(rt.b)];
    const stops=rt.s.slice(fe.o,to+1).map(s=>SN[String(s)]);
    const sc=to-fe.o,pop=BPOP[String(rt.b)]||1;
    res.push({type:'direct',busName:bus.n,busNameBn:bus.bn||'',svc:bus.st||'',ot:bus.ot||'',stopsCount:sc,stops,score:sc-pop*0.6,busId:String(rt.b),stopIds:rt.s,fromOrd:fe.o,toOrd:to});
  }
  return res.sort((a,b)=>a.score-b.score);
}
function findTransfer(fId,tId){
  const ts=String(tId),tm={};
  for(const e of(SR[ts]||[]))tm[e.r]=e.o;
  const seen=new Set(),res=[];
  for(const fe of(SR[String(fId)]||[])){
    const r1=RBI[fe.r];
    for(let i=fe.o+1;i<r1.s.length;i++){
      const mid=r1.s[i],ms=String(mid);
      for(const me of(SR[ms]||[])){
        if(me.r===fe.r||!(me.r in tm))continue;
        const to2=tm[me.r];if(me.o>=to2)continue;
        const key=fe.r+'-'+me.r+'-'+mid;if(seen.has(key))continue;seen.add(key);
        const b1=BUSES[String(r1.b)],r2=RBI[me.r],b2=BUSES[String(r2.b)];
        const l1=i-fe.o,l2=to2-me.o;
        res.push({type:'transfer',transferStop:SN[ms],totalStops:l1+l2,
          leg1:{busName:b1.n,busNameBn:b1.bn||'',stopsCount:l1,svc:b1.st||'',ot:b1.ot||'',stopIds:r1.s,fromOrd:fe.o,toOrd:i},
          leg2:{busName:b2.n,busNameBn:b2.bn||'',stopsCount:l2,svc:b2.st||'',ot:b2.ot||'',stopIds:r2.s,fromOrd:me.o,toOrd:to2}});
      }
    }
  }
  return res.sort((a,b)=>a.totalStops-b.totalStops).slice(0,5);
}

function acFilter(q,list,lim){
  const nq=norm(q);
  return list.filter(s=>norm(s).includes(nq)).slice(0,lim||9);
}
function acHL(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}
function setupAC(inpId,dropId,list,onSelect){
  const inp=document.getElementById(inpId),drop=document.getElementById(dropId);
  let sel=-1;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();sel=-1;
    if(!q){drop.classList.remove('on');return;}
    const hits=acFilter(q,list);
    if(!hits.length){drop.classList.remove('on');return;}
    drop.innerHTML=hits.map(s=>'<div class="aci" data-n="'+s+'">'+acHL(s,q)+'</div>').join('');
    drop.classList.add('on');
  });
  drop.addEventListener('click',e=>{
    const item=e.target.closest('.aci');if(!item)return;
    inp.value=item.dataset.n;drop.classList.remove('on');
    if(onSelect)onSelect(item.dataset.n);
  });
  inp.addEventListener('keydown',e=>{
    const items=drop.querySelectorAll('.aci');
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('sel',i===sel));}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,-1);items.forEach((el,i)=>el.classList.toggle('sel',i===sel));}
    else if(e.key==='Enter'){if(sel>=0&&items[sel]){inp.value=items[sel].dataset.n;drop.classList.remove('on');if(onSelect)onSelect(items[sel].dataset.n);}else{drop.classList.remove('on');if(inpId==='toIn'||inpId==='fromIn')doSearch();}}
    else if(e.key==='Escape')drop.classList.remove('on');
  });
  inp.addEventListener('focus',()=>{if(inp.value.trim())inp.dispatchEvent(new Event('input'));});
}

function doSearch(){
  const from=document.getElementById('fromIn').value.trim(),to=document.getElementById('toIn').value.trim();
  if(!from||!to){showErr('Please enter both From and To stops.');return;}
  if(from.toLowerCase()===to.toLowerCase()){showErr('From and To cannot be the same stop.');return;}
  const btn=document.getElementById('findBtn');
  document.getElementById('findLbl').style.display='none';
  document.getElementById('findSp').style.display='block';
  btn.disabled=true;
  const res=document.getElementById('routeResult');
  res.style.display='block';
  res.innerHTML='<div class="loading-msg">Searching routes...</div>';
  setTimeout(()=>{
    try{
      const fid=findStop(from),tid=findStop(to);
      if(fid===null||fid===undefined){showErr('Stop not found: "'+from+'"');return;}
      if(tid===null||tid===undefined){showErr('Stop not found: "'+to+'"');return;}
      GF=SN[String(fid)];GTO=SN[String(tid)];

    }catch(e){showErr('Something went wrong.');console.error(e);}
    finally{document.getElementById('findLbl').style.display='';document.getElementById('findSp').style.display='none';btn.disabled=false;}
  },40);
}

    const mid=stops[Math.floor(stops.length/2)]||'';
    steps=[
      {n:1,c:'',a:'Go to <strong>'+fn+'</strong>',d:'Stand on the correct side of the road.'},
      {n:2,c:'',a:'Board <strong>'+busName+'</strong>',d:'Ask: <strong>"'+tn+' যাবে?"</strong>'+(svc?' ('+svc+')':'')+(ot?' — Runs '+ot:''),tip:null},
      {n:3,c:'b',a:'Ride <strong>'+sc+' stops</strong> (~'+timeEst(sc)+')',d:'Pay <strong>'+fareEst(sc)+'</strong> to conductor.'+(stops.length>5?' Passes through '+mid+'.':''),tip:null},
      {n:4,c:'d',a:'Get off at <strong>'+tn+'</strong>',d:'Tell conductor <strong>"নামবো"</strong> as you approach.',tip:null},
    ];
  }else{
    const{leg1,leg2,transferStop}=route;
    steps=[
      {n:1,c:'',a:'Go to <strong>'+fn+'</strong>',d:'Wait on the correct side of the road.'},
      {n:2,c:'',a:'Board <strong>'+leg1.busName+'</strong>',d:'Ask: <strong>"'+transferStop+' যাবে?"</strong>'},
      {n:3,c:'b',a:'Ride to <strong>'+transferStop+'</strong>',d:'Pay '+fareEst(leg1.stopsCount)+'. Get ready to exit.',tip:'⚡ Don\'t miss this stop — changing buses here!'},
      {n:4,c:'y',a:'Board <strong>'+leg2.busName+'</strong>',d:'Ask: <strong>"'+tn+' যাবে?"</strong> before boarding.'},
      {n:5,c:'d',a:'Get off at <strong>'+tn+'</strong>',d:'Tell conductor <strong>"নামবো"</strong> as you approach.',tip:null},
    ];
  }
  return '<div class="steps">'+steps.map(s=>'<div class="step"><div class="step-line"></div><div class="snum '+s.c+'">'+s.n+'</div><div class="stxt"><div class="sact">'+s.a+'</div><div class="sdet">'+s.d+'</div>'+(s.tip?'<div class="stip">'+s.tip+'</div>':'')+'</div></div>').join('')+'</div>';
}
function trailHTML(stops){
  return '<div class="trail"><div class="tinner">'+stops.map((s,i)=>{
    const hl=i===0||i===stops.length-1;
    return'<div class="tstop'+(hl?' hl':'')+'"><div class="tdot"></div><div class="tname">'+s+'</div></div>';
  }).join('')+'</div></div>';
}
function buildDirect(r,fn,tn,idx){
  const key=('D'+r.busName+fn+tn).replace(/[^a-z0-9]/gi,'_');
  const v=votes(key),tip=TIPS[idx%TIPS.length];
  const easy=r.stopsCount<=5;
  return '<div class="rcard'+(idx===0?' open':'')+'" style="animation-delay:'+(idx*60)+'ms">'+
    '<div class="rcard-hd">'+
    '<div class="rico">🚌</div>'+
    '<div class="rinfo">'+
    '<div class="rname">'+r.busName+'</div>'+
    (r.busNameBn?'<div class="rname-bn">'+r.busNameBn+'</div>':'')+
    '<div class="rtags2">'+
    '<span class="rtag '+(easy?'rtag-easy':'rtag-med')+'">'+(easy?'🟢 Easy':'🟡 Medium')+'</span>'+
    '<span class="rtag rtag-stops">'+r.stopsCount+' stops</span>'+
    '<span class="rtag rtag-time">⏱ '+timeEst(r.stopsCount)+'</span>'+
    '<span class="rtag rtag-fare">'+fareEst(r.stopsCount)+'</span>'+
    (r.ot?'<span class="rtag rtag-ot">'+r.ot+'</span>':'')+
    '</div></div>'+
    '<div class="chev">▼</div></div>'+
    '<div class="rbody">'+
    '<div class="why-section"><div class="why-title">Why this route</div>'+reasonsHTML(r)+'</div>'+
    '<div class="ltip">💬 '+tip+'</div>'+
    stepsHTML(r,fn,tn)+
    trailHTML(r.stops)+
    '<div class="verrow" id="ver-'+key+'">'+
    '<span class="verq">Still working?</span>'+
    '<div class="vbtns"><button class="vbtn vy" data-key="'+key+'" data-type="y"'+(v.v?' disabled':'')+'>👍 Yes'+(v.y?' ('+v.y+')':'')+'</button>'+
    '<button class="vbtn vn" data-key="'+key+'" data-type="n"'+(v.v?' disabled':'')+'>👎 No</button></div>'+
    (v.y?'<span class="vok">✓ '+v.y+' confirmed</span>':'<span class="vnone">Be first to verify</span>')+
    '</div></div></div>';
}
function buildTransfer(t,fn,tn,idx){
  const key=('T'+t.leg1.busName+t.leg2.busName+fn+tn).replace(/[^a-z0-9]/gi,'_');
  const v=votes(key),tip=TIPS_T[idx%TIPS_T.length];
  return '<div class="rcard" style="animation-delay:'+(idx*60)+'ms">'+
    '<div class="rcard-hd">'+
    '<div class="rico rico-tr">🔄</div>'+
    '<div class="rinfo">'+
    '<div class="rname">'+t.leg1.busName+' → '+t.leg2.busName+'</div>'+
    '<div class="rname-bn">Transfer at '+t.transferStop+'</div>'+
    '<div class="rtags2">'+
    '<span class="rtag rtag-tr">1 Change</span>'+
    '<span class="rtag rtag-stops">'+t.totalStops+' stops</span>'+
    '<span class="rtag rtag-time">⏱ '+timeEst(t.totalStops)+'</span>'+
    '</div></div>'+
    '<div class="chev">▼</div></div>'+
    '<div class="rbody">'+
    '<div class="ltip">💬 '+tip+'</div>'+
    stepsHTML(t,fn,tn)+
    '<div class="transfer-legs">'+
    '<div class="tleg"><div class="tleg-n">LEG 1</div><div class="tleg-bus">🚌 '+t.leg1.busName+'</div><div class="tleg-s">'+t.leg1.stopsCount+' stops'+(t.leg1.svc?' · '+t.leg1.svc:'')+'</div></div>'+
    '<div class="tpt">⇕ Change at <strong>'+t.transferStop+'</strong></div>'+
    '<div class="tleg"><div class="tleg-n">LEG 2</div><div class="tleg-bus">🚌 '+t.leg2.busName+'</div><div class="tleg-s">'+t.leg2.stopsCount+' stops'+(t.leg2.svc?' · '+t.leg2.svc:'')+'</div></div>'+
    '</div>'+
    '<div class="verrow" id="ver-'+key+'">'+
    '<span class="verq">Still working?</span>'+
    '<div class="vbtns"><button class="vbtn vy" data-key="'+key+'" data-type="y"'+(v.v?' disabled':'')+'>👍 Yes</button>'+
    '<button class="vbtn vn" data-key="'+key+'" data-type="n"'+(v.v?' disabled':'')+'>👎 No</button></div>'+
    (v.y?'<span class="vok">✓ '+v.y+' confirmed</span>':'<span class="vnone">Be first to verify</span>')+
    '</div></div></div>';
}
// ── VISITOR COUNTER (2-min cooldown, cached display) ─────────────────────────
(function(){
  const COOLDOWN=2*60*1000;
  const TS_KEY='dkbus_last_visit';
  const CNT_KEY='dkbus_last_count';
  function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);}
  function showCount(n){var el=document.getElementById('vcNum');if(el)el.textContent=fmt(n);}
  try{
    var last=parseInt(localStorage.getItem(TS_KEY)||'0',10);
    var now=Date.now();
    var cached=localStorage.getItem(CNT_KEY);
    if(now-last>COOLDOWN){
      // Enough time passed — increment and save new count + timestamp
      localStorage.setItem(TS_KEY,String(now));
      fetch('https://api.counterapi.dev/v1/dhakabus-finder/visits/up')
        .then(function(r){return r.json();})
        .then(function(d){
          showCount(d.count);
          localStorage.setItem(CNT_KEY,String(d.count));
        })
        .catch(function(){if(cached)showCount(parseInt(cached,10));});
    }else{
      // Within cooldown — show cached number, no API call at all
      if(cached)showCount(parseInt(cached,10));
    }
  }catch(e){}
})();

function renderRoutes(){
  const res=document.getElementById('routeResult');
  if(!GD.length&&!GT.length){
    res.innerHTML='<div class="no-result"><div class="no-em">🚫</div><p>No route found between<br><strong>'+GF+'</strong> and <strong>'+GTO+'</strong>.<br>Try a nearby stop.</p></div>';
    return;
  }
  const best=GD[0];
  let html='<div class="result-header">'+
    '<div class="result-from-to">'+GF+' <span class="res-arr">→</span> '+GTO+'</div>'+
    '<div class="result-counts">'+
    (GD.length?'<span class="rc-d">'+GD.length+' direct</span>':'')+
    (GT.length?'<span class="rc-t">'+GT.length+' with change</span>':'')+
    '</div></div>';
  if(best){
    html+='<div class="summary-bar">'+
      '<div class="sb-item"><div class="sb-val">'+fareEst(best.stopsCount)+'</div><div class="sb-lbl">Est. Fare</div></div>'+
      '<div class="sb-div"></div>'+
      '<div class="sb-item"><div class="sb-val">'+best.stopsCount+'</div><div class="sb-lbl">Stops</div></div>'+
      '<div class="sb-div"></div>'+
      '<div class="sb-item"><div class="sb-val">'+timeEst(best.stopsCount).split('–')[0]+'</div><div class="sb-lbl">Est. Min</div></div>'+
      '</div>';
  }
  html+='<div class="rtabs">'+
    '<div class="rtab on" data-panel="rtp-best">⭐ Best</div>'+
    (GD.length>1?'<div class="rtab" data-panel="rtp-all">🚌 All Direct ('+GD.length+')</div>':'')+
    (GT.length?'<div class="rtab" data-panel="rtp-tr">🔄 With Change</div>':'')+
    '</div>';
  html+='<div class="rtpanel on" id="rtp-best">';
  if(best){
    html+=buildDirect(best,GF,GTO,0);
    if(GD.length>1){html+='<div class="alt-label">Alternative</div>';html+=buildDirect(GD[1],GF,GTO,1);}
  }else html+=buildTransfer(GT[0],GF,GTO,0);
  html+='</div>';
  if(GD.length>1){html+='<div class="rtpanel" id="rtp-all">';GD.forEach((r,i)=>{html+=buildDirect(r,GF,GTO,i);});html+='</div>';}
  if(GT.length){html+='<div class="rtpanel" id="rtp-tr">';GT.forEach((t,i)=>{html+=buildTransfer(t,GF,GTO,i);});html+='</div>';}
  res.innerHTML=html;
}

</script>
